<div>
  <h2>Каталог приходных документов</h2>

  <div *ngIf="loading">Загрузка...</div>
  <div *ngIf="error">{{ error }}</div>

  <table *ngIf="!loading && docs.length">
    <thead>
      <tr>
        <th>№</th><th>Дата</th><th>Контрагент</th><th>Склад</th><th>Проведён</th><th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of docs">
        <td>{{ d.documentNumber }}</td>
        <td>{{ d.documentDate }}</td>
        <td>{{ d.contragent?.name }}</td>
        <td>{{ d.warehouse?.name }}</td>
        <td>{{ d.posted ? 'Да' : 'Нет' }}</td>
        <td>
          <button (click)="post(d)" [disabled]="d.posted">Провести</button>
          <button (click)="unpost(d)" [disabled]="!d.posted">Отменить</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !docs.length">Список пуст</div>
</div>
