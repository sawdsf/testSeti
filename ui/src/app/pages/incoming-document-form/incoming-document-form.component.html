<div>
  <h2>Форма приходного документа</h2>

  <div *ngIf="error" style="color:red">{{ error }}</div>

  <form (ngSubmit)="save()">
    <label>Дата:
      <input type="date" [(ngModel)]="doc.documentDate" name="documentDate">
    </label>

    <label>Номер:
      <input type="text" [(ngModel)]="doc.documentNumber" name="documentNumber">
    </label>

    <label>Контрагент:
      <select [(ngModel)]="doc.contragent" name="contragent">
        <option [ngValue]="undefined">--</option>
        <option *ngFor="let c of contragents" [ngValue]="c">{{ c.name }}</option>
      </select>
    </label>

    <label>Договор:
      <select [(ngModel)]="doc.contract" name="contract">
        <option [ngValue]="undefined">--</option>
        <option *ngFor="let c of contracts" [ngValue]="c">{{ c.name }}</option>
      </select>
    </label>

    <label>Склад:
      <select [(ngModel)]="doc.warehouse" name="warehouse">
        <option [ngValue]="undefined">--</option>
        <option *ngFor="let w of warehouses" [ngValue]="w">{{ w.name }}</option>
      </select>
    </label>

    <h3>Строки ТМЦ</h3>

    <input type="file" accept=".csv" (change)="handleCsvUpload($event)">

    <table>
      <thead>
        <tr><th>ТМЦ</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of doc.rows; let i = index">
          <td>
            <select (change)="onTmcChange(r, $any($event.target).value)">
              <option [ngValue]="0">--</option>
              <option *ngFor="let t of tmcs" [value]="t.id">{{ t.name }}</option>
            </select>
          </td>
          <td><input type="number" [(ngModel)]="r.quantity" name="qty{{i}}" (input)="updateRow(r)"></td>
          <td><input type="number" [(ngModel)]="r.price" name="price{{i}}" (input)="updateRow(r)"></td>
          <td>{{ r.total }}</td>
          <td><button type="button" (click)="removeRow(i)">Удалить</button></td>
        </tr>
      </tbody>
    </table>

    <button type="button" (click)="addRow()">Добавить строку</button>
    <button type="submit">Сохранить документ</button>
  </form>
</div>
